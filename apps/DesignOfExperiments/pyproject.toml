[project]
name = "designofexperiments"
version = "0.2.2"
description = "HySPRINT DesignOfExperiments app"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "notebook>=7.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.24",
    "scipy>=1.10",
    "voila>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
