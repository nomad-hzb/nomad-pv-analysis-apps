[project]
name = "isa-previewer"
version = "0.5.0"
description = "Preview and analyse in-situ (GIWAXS, optical, logging) HDF5 runs produced by insitu_analyser"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils",
    # insitu_analyser is not listed here: bootstrap.py installs it from
    # [tool.hysprint.track-tags] below.
    "h5py>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.0",
    "matplotlib>=3.0",
    # The video notebook: insitu_analyser keeps these in its optional [video] extra (the h5
    # creation does not need them), and bootstrap installs tracked tags without extras.
    "opencv-python-headless",
    "pymediainfo",
]

# insitu_analyser follows its newest release tag: bootstrap.py checks the remote on every launch
# and installs a newer tag, a new line (v0.2 -> v0.3) included, so an insitu_analyser release (a
# pushed tag) reaches the Oasis without a commit here. Still always an exact tag, never a branch,
# so the running version stays known (bootstrap logs it). To hold it on one line, e.g. while
# this app is not yet ready for a breaking release, add `series = "v0.2"`.
[tool.hysprint.track-tags]
insitu_analyser = { url = "https://codebase.helmholtz.cloud/hzb-se-alm/insitu_analyser.git" }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
