[project]
name = "isa-previewer"
version = "0.1.0"
description = "Preview and analyse in-situ (GIWAXS, optical, logging) HDF5 runs produced by insitu_analyser"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils @ file:///home/jovyan/uploads/analysis_apps_restructuring-WxUahazkSNy-bSE9GaZyZQ/shared",
    # Replaces the notebooks' own "pip install git+..." cell, which re-cloned develop on every
    # kernel start. Pinned to a tag instead: the ref is resolved once at install time either
    # way, so a branch would only hide which version is actually running. Raise this line to
    # adopt a newer insitu_analyser; it is also what keeps the app working if the develop
    # branch is ever removed.
    "insitu_analyser @ git+https://codebase.helmholtz.cloud/hzb-se-alm/insitu_analyser.git@v0.1.49",
    "h5py>=3.8",
    "ipympl>=0.9",
    "ipywidgets>=8.0",
    "matplotlib>=3.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
