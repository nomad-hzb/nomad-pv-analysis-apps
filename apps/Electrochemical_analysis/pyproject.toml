[project]
name = "electrochemical-analysis"
version = "0.1.1"
description = "HySPRINT Electrochemical analysis app"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils",
    "impedance>=1.7",
    "lmfit>=1.2",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "requests_cache>=1.0",
    "scipy>=1.10",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
