[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jv-analysis"
version = "5.4.2"
description = "JV Analysis app for HySPRINT NOMAD Oasis"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils",
    "pydantic>=2.0",
    "pandas",
    "numpy",
    "plotly",
    "anywidget>=0.9",  # go.FigureWidget needs it
    "ipywidgets",
    "ipython",
    "notebook",
    "voila",
    "natsort",
    "requests",
    "openpyxl",
    "scipy",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
