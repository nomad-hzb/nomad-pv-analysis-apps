[project]
name = "wetting-envelope"
version = "0.2.2"
description = "Interactive wetting envelope plotter (Owens-Wendt model)"
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.0",
    "plotly>=5.0",
    "anywidget>=0.9",  # go.FigureWidget needs it
    "numpy>=1.24",
    "pydantic>=2.0",
    "hysprint-utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true
