[project]
name = "bitmap-maker"
version = "0.2.1"
description = "HySPRINT bitmap maker app"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils",
    "ipython>=8.12",
    "ipywidgets>=8.1",
    "numpy>=1.24",
    "Pillow>=9.0",
    "scipy>=1.10",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
