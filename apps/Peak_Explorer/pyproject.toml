[project]
name = "peak-explorer"
version = "0.3.4"
description = "HySPRINT Peak Explorer app"
requires-python = ">=3.10"
dependencies = [
    "hysprint-utils",
    "h5py>=3.11",
    "ipython>=8.12",
    "ipyvuetify>=1.11",
    "ipywidgets>=8.1",
    "lmfit>=1.3",
    "nest-asyncio>=1.6",
    "numpy>=2.0",  # np.trapezoid
    "openpyxl>=3.1",
    "packaging>=23.0",
    "pandas>=2.2.2",
    "plotly>=5.24",
    "anywidget>=0.9",  # go.FigureWidget needs it
    "scipy>=1.13",
    "tqdm>=4.67",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
