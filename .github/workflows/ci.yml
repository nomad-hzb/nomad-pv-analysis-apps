name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Every app is linted; the parked notebook-only folders are excluded in the root
      # pyproject.toml (extend-exclude), not here.
      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Repo rules (notebooks, sys.path, URL literals, app pyproject shape)
        run: python scripts/check_repo_rules.py

  discover:
    name: Find test suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        # One job per tests/<folder>, so a new app's tests run without editing this file.
        run: |
          suites=$(find tests -mindepth 1 -maxdepth 1 -type d ! -name __pycache__ ! -name live -printf '%f\n' \
            | sort | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  test:
    name: "Tests: ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    # Not gated on lint, so a lint failure never hides the test results.
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # shared/ plus the app's own pyproject dependencies, as bootstrap.py installs them.
      - name: Install dependencies
        run: python scripts/ci_install_test_deps.py "${{ matrix.suite }}"

      - name: Run tests (no live)
        run: python -m pytest "tests/${{ matrix.suite }}" -m "not live" -q
